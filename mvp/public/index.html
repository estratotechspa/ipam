<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPAM</title>
<link id="favicon" rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/brand.css">
</head>
<body>
<a class="saltar" href="#contenido">Saltar al contenido</a>
<header class="top">
  <h1 id="marca"><img id="logo" alt="" hidden><span id="nombre">IPAM</span> <span id="subtitulo" class="muted"></span></h1>
  <nav class="nav" id="nav" aria-label="Secciones">
    <button type="button" data-t="pools" data-ic="capas" aria-current="page" class="on">Pools</button>
    <button type="button" data-t="asig" data-ic="lista">Asignaciones</button>
    <button type="button" data-t="reservas" data-ic="reloj">Reservas</button>
    <button type="button" data-t="ips" data-ic="servidor">Direcciones IP</button>
    <button type="button" data-t="jira" data-ic="flujo">Jira</button>
    <button type="button" data-t="tokens" data-ic="llave" hidden>Tokens</button>
    <button type="button" data-t="usuarios" data-ic="usuarios" hidden>Usuarios</button>
    <a id="enlace-api" href="/api.html" title="Documentación y pruebas de la API">API</a>
    <span id="yo"></span>
  </nav>
</header>

<main id="contenido" tabindex="-1">
  <section class="wrap" id="pools" aria-label="Pools"></section>
  <section class="wrap hide" id="asig" aria-label="Asignaciones"></section>
  <section class="wrap hide" id="reservas" aria-label="Reservas"></section>
  <section class="wrap hide" id="ips" aria-label="Direcciones IP"></section>
  <section class="wrap hide" id="jira" aria-label="Jira"></section>
  <section class="wrap hide" id="tokens" aria-label="Tokens"></section>
  <section class="wrap hide" id="usuarios" aria-label="Usuarios"></section>
  <section class="wrap hide" id="importar" aria-label="Importar segmentos"></section>
</main>

<footer id="pie" class="muted"></footer>
<div id="toasts" class="toasts" role="region" aria-label="Notificaciones" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
