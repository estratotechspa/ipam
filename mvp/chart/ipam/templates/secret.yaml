{{- if not .Values.secrets.existingSecret }}
{{- $name := printf "%s-secrets" (include "ipam.name" .) }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $keep := dict }}
{{- if $old }}{{ range $k, $v := $old.data }}{{ $_ := set $keep $k ($v | b64dec) }}{{ end }}{{ end }}
{{- $pg := coalesce (get $keep "POSTGRES_PASSWORD") (randAlphaNum 24) }}
{{- $hook := coalesce .Values.secrets.jiraWebhookSecret (get $keep "JIRA_WEBHOOK_SECRET") (randAlphaNum 40) }}
{{- $pass := coalesce .Values.secrets.appPass (get $keep "APP_PASS") (ternary (randAlphaNum 16) "" (ne .Values.secrets.appUser "")) }}
{{- $oidcSecret := coalesce .Values.secrets.oidcClientSecret (get $keep "OIDC_CLIENT_SECRET") }}
{{- $session := coalesce .Values.secrets.sessionSecret (get $keep "SESSION_SECRET") (randAlphaNum 48) }}
{{- if and .Values.auth.oidc.issuer (not $oidcSecret) }}{{ fail "Con auth.oidc.issuer debes indicar secrets.oidcClientSecret o secrets.existingSecret" }}{{ end }}
{{- $dburl := ternary (printf "postgres://ipam:%s@%s:5432/ipam" $pg (include "ipam.pgHost" .)) .Values.secrets.databaseUrl .Values.postgres.enabled }}
{{- if and (not .Values.postgres.enabled) (not $dburl) }}{{ fail "Con postgres.enabled=false debes indicar secrets.databaseUrl o secrets.existingSecret" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "ipam.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ $dburl | quote }}
  POSTGRES_PASSWORD: {{ $pg | quote }}
  APP_USER: {{ .Values.secrets.appUser | quote }}
  APP_PASS: {{ $pass | quote }}
  JIRA_WEBHOOK_SECRET: {{ $hook | quote }}
  OIDC_CLIENT_SECRET: {{ $oidcSecret | quote }}
  SESSION_SECRET: {{ $session | quote }}
{{- end }}
