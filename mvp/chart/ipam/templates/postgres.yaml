{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ipam.pgHost" . }}
  labels: {{- include "ipam.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: db}
  ports: [{name: pg, port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ipam.pgHost" . }}
  labels: {{- include "ipam.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "ipam.pgHost" . }}
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: db}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ipam, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: db}
    spec:
      securityContext: {runAsUser: 70, runAsGroup: 70, fsGroup: 70}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - {name: POSTGRES_USER, value: ipam}
            - {name: POSTGRES_DB, value: ipam}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "ipam.secretName" . }}, key: POSTGRES_PASSWORD}}
          ports: [{name: pg, containerPort: 5432}]
          readinessProbe: {exec: {command: [pg_isready, -U, ipam, -d, ipam]}, periodSeconds: 5}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
      {{- if not .Values.postgres.persistence.enabled }}
      volumes: [{name: data, emptyDir: {}}]
      {{- end }}
  {{- if .Values.postgres.persistence.enabled }}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.postgres.persistence.size }}}}
  {{- end }}
{{- end }}
