{{- if .Values.networkPolicy.enabled }}
# App: entra solo por su puerto; sale a DNS, a la base y a HTTPS (Jira / OIDC).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ipam.name" . }}
  labels: {{- include "ipam.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "ipam.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{port: {{ .Values.config.port }}, protocol: TCP}]
      {{- with .Values.networkPolicy.ingressFrom }}
      from: {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    - ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - ports: [{port: 443, protocol: TCP}]
    {{- if .Values.postgres.enabled }}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: db}
      ports: [{port: 5432, protocol: TCP}]
    {{- else }}
    - ports: [{port: {{ .Values.networkPolicy.externalDatabasePort }}, protocol: TCP}]
    {{- end }}
    {{- with .Values.networkPolicy.egressExtra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- if .Values.postgres.enabled }}
---
# Base incluida: solo la app y el Job de esquema pueden conectarse.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ipam.pgHost" . }}
  labels: {{- include "ipam.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: db}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api}
        - podSelector:
            matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: migrate}
      ports: [{port: 5432, protocol: TCP}]
{{- end }}
{{- end }}
