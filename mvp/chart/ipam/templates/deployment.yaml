apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ipam.name" . }}
  labels: {{- include "ipam.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "ipam.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ipam.selector" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.secrets.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ipam.name" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          ports: [{name: http, containerPort: {{ .Values.config.port }}}]
          envFrom:
            - configMapRef: {name: {{ include "ipam.name" . }}-config}
          env:
            {{- if .Values.secrets.asFiles }}
            {{- range $k := list "DATABASE_URL" "APP_USER" "APP_PASS" "JIRA_WEBHOOK_SECRET" "OIDC_CLIENT_SECRET" "SESSION_SECRET" "METRICS_TOKEN" }}
            - {name: {{ $k }}_FILE, value: /etc/ipam-secrets/{{ $k }}}
            {{- end }}
            {{- else }}
            {{- range $k := list "DATABASE_URL" "APP_USER" "APP_PASS" "JIRA_WEBHOOK_SECRET" }}
            - name: {{ $k }}
              valueFrom: {secretKeyRef: {name: {{ include "ipam.secretName" $ }}, key: {{ $k }}}}
            {{- end }}
            {{- range $k := list "OIDC_CLIENT_SECRET" "SESSION_SECRET" "METRICS_TOKEN" }}
            - name: {{ $k }}
              valueFrom: {secretKeyRef: {name: {{ include "ipam.secretName" $ }}, key: {{ $k }}, optional: true}}
            {{- end }}
            {{- end }}
          # /healthz = vivo (sin tocar la base) · /readyz = listo (base alcanzable y esquema al día)
          startupProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 2, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 20}
          {{- if or .Values.branding.logo .Values.secrets.asFiles }}
          volumeMounts:
            {{- if .Values.branding.logo }}
            - {name: brand, mountPath: /etc/ipam-brand, readOnly: true}
            {{- end }}
            {{- if .Values.secrets.asFiles }}
            - {name: secretos, mountPath: /etc/ipam-secrets, readOnly: true}
            {{- end }}
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      {{- if or .Values.branding.logo .Values.secrets.asFiles }}
      volumes:
        {{- if .Values.branding.logo }}
        - name: brand
          configMap: {name: {{ include "ipam.name" . }}-brand}
        {{- end }}
        {{- if .Values.secrets.asFiles }}
        - name: secretos
          secret: {secretName: {{ include "ipam.secretName" . }}, defaultMode: 0440}
        {{- end }}
      {{- end }}
