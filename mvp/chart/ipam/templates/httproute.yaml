{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ipam.name" . }}
  labels: {{- include "ipam.labels" . | nindent 4 }}
spec:
  {{- with .Values.httpRoute.parentRefs }}
  parentRefs: {{- toYaml . | nindent 4 }}
  {{- end }}
  hostnames:
    {{- range (default (list .Values.ingress.host) .Values.httpRoute.hostnames) }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - backendRefs:
        - {name: {{ include "ipam.name" . }}, port: {{ .Values.service.port }}}
{{- end }}
