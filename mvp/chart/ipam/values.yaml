image:
  repository: ipam-mvp          # p. ej. ghcr.io/estratotechspa/ipam
  tag: "0.1.0"
  pullPolicy: IfNotPresent
imagePullSecrets: []            # [{name: ghcr-pull}] si el registro es privado

replicaCount: 1
terminationGracePeriodSeconds: 30   # debe ser mayor que APAGADO_TIMEOUT_MS (15 s por defecto): el apagado ordenado termina las peticiones en curso

# ServiceAccount de Kubernetes. Para identidad de carga de trabajo (sin llaves de larga duración):
#   GKE:  {iam.gke.io/gcp-service-account: ipam@PROYECTO.iam.gserviceaccount.com}
#   EKS:  {eks.amazonaws.com/role-arn: arn:aws:iam::CUENTA:role/ipam}
#   AKS:  {azure.workload.identity/client-id: <id-del-cliente>}
serviceAccount:
  annotations: {}

# Configuración NO secreta (ConfigMap)
config:
  port: 8080
  # URL pública con la que los usuarios abren el IPAM (p. ej. https://ipam.estratotech.cl). Vacío = se deduce de
  # ingress.host (https si hay ingress.tls). Obligatoria con auth.oidc.issuer: de ella sale la URL de retorno del login.
  publicUrl: ""
  trustProxy: "1"               # saltos de proxy delante de la app (ingress); "" para desactivar
  hsts: false                   # true si el acceso es siempre por HTTPS
  logLevel: info                # debug | info | warn | error (logs JSON a stdout)
  role: todos                   # api | worker | todos: qué hace cada réplica (api = solo HTTP, worker = solo barredor)
  databaseSchema: public        # esquema de PostgreSQL donde viven las tablas (el POC usa «ipam»)
  migrarAlArrancar: false       # EXCEPCIÓN: aplicar el esquema al arrancar la app. Lo normal es el Job de esquema de este chart.
  # Reservas tentativas (agentes): una reserva sin confirmar expira sola.
  reservaTtlHoras: 24           # vigencia por defecto
  reservaTtlMaxHoras: 72        # máximo que se puede pedir
  confirmacionExigeAprobador: true   # un token debe declarar quién aprobó (aprobado_por) y la referencia al confirmar (human-in-the-loop)
  barredorIntervaloSegundos: 60

# Marca: todo opcional y sin reconstruir la imagen.
branding:
  name: ""                      # vacío = «IPAM»
  subtitle: ""
  footer: ""
  color: ""                     # botones, p. ej. "#0a7d4f"
  colorTop: ""                  # barra superior
  colorAccent: ""               # pestaña activa
  logo: ""                      # archivo png/jpg/webp/svg (≤ 512 KB) en base64:
                                #   --set-string branding.logo="$(base64 < logo.png | tr -d '\n')"

# Inicio de sesión con OpenID Connect (Google Workspace, Microsoft Entra, Okta, Keycloak…).
# Con issuer vacío el panel usa Basic Auth (secrets.appUser/appPass) o queda abierto (solo demos).
# URL de retorno a registrar en el proveedor:  <publicUrl>/auth/callback
auth:
  # SOLO PARA DEMOS: permite entrar sin credenciales (todos como admin). Por defecto NO: sin OIDC, Basic (secrets.appUser) ni
  # existingSecret, el chart se niega a renderizar, y la app se niega a arrancar en producción sin autenticación.
  allowAnonymous: false
  oidc:
    issuer: ""                  # Google: https://accounts.google.com · Entra: https://login.microsoftonline.com/<tenant>/v2.0
    clientId: ""
    scopes: "openid email profile"   # añade «groups» si el proveedor entrega grupos
    allowedDomains: ""          # dominios de correo permitidos, separados por coma (p. ej. empresa.cl)
    adminEmails: ""             # administradores por correo (siempre pueden entrar: evita quedar fuera)
    requesterEmails: ""
    readerEmails: ""
    groupsClaim: groups
    adminGroups: ""
    requesterGroups: ""
    readerGroups: ""
    defaultRole: lector         # rol de quien no coincide con nada; «ninguno» = solo entran los mapeados
    sessionHours: 8

# Secretos. Dos formas:
#  a) Dejar vacío: el chart genera claves aleatorias (y las conserva entre upgrades).
#  b) existingSecret: usar un Secret que ya tienes en el clúster (kubectl, Sealed Secrets,
#     External Secrets, etc.) con las claves: DATABASE_URL, POSTGRES_PASSWORD (solo si postgres.enabled),
#     APP_USER, APP_PASS, JIRA_WEBHOOK_SECRET y, con OIDC, OIDC_CLIENT_SECRET y SESSION_SECRET (≥ 32 caracteres).
secrets:
  existingSecret: ""
  # true = el Secret se monta como archivos (/etc/ipam-secrets/NOMBRE) y la app lee NOMBRE_FILE, en vez de variables de entorno.
  # Es la forma que usan Secret Manager (CSI driver), Key Vault y Docker secrets; la app funciona igual con las dos.
  asFiles: false
  appUser: ""                   # vacío = sin clave de acceso en el panel
  appPass: ""
  jiraWebhookSecret: ""         # vacío = se genera
  oidcClientSecret: ""          # secreto del cliente OIDC (obligatorio si auth.oidc.issuer)
  sessionSecret: ""              # firma de la cookie de sesión; vacío = se genera y se conserva
  databaseUrl: ""               # solo con postgres.enabled=false (base externa, p. ej. Cloud SQL)

# PostgreSQL incluido (StatefulSet). Para producción se recomienda una base administrada:
# postgres.enabled=false y secrets.databaseUrl / existingSecret.
postgres:
  enabled: true
  image: postgres:16-alpine
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

  # Respaldos incrementales (pgBackRest) con archivado continuo de WAL → recuperación a un punto en el tiempo.
  # Solo para el PostgreSQL incluido. Con una base administrada (Cloud SQL, RDS…) usa sus respaldos nativos.
  # Política por defecto: completo cada domingo + incremental el resto de los días, 02:00 UTC; se conservan 4 completos
  # (≈ 4 semanas) con sus incrementales y los WAL necesarios; el día 1 de cada mes se restaura el último respaldo en un
  # directorio temporal y se comprueba (ver docs/RESPALDOS.md).
  backup:
    enabled: false
    image: ghcr.io/estratotechspa/ipam-postgres:16   # construida desde mvp/postgres (postgres + pgBackRest)
    retentionFull: 4
    schedule: {hour: "02", fullDay: "0", restoreTestDay: "01"}
    repo:
      type: gcs                 # gcs | posix (posix = volumen propio; para pruebas o NFS, no para producción)
      path: /ipam               # prefijo dentro del bucket (o ruta en el volumen)
      gcs:
        bucket: ""
        keyType: auto           # auto = Workload Identity / cuenta de servicio del nodo · service = llave JSON en un Secret
        keySecret: ""           # con keyType=service: Secret con la clave «key.json»
        endpoint: ""            # redes sin salida a Internet: endpoint privado (Private Service Connect), p. ej. storage.p.googleapis.com
        verifyTls: true
      posix: {size: 5Gi, storageClass: ""}
    serviceAccountAnnotations: {}   # Workload Identity: {iam.gke.io/gcp-service-account: ipam-backup@PROYECTO.iam.gserviceaccount.com}
    resources:
      requests: {cpu: 20m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}

# Datos de ejemplo (6 pools, 12 asignaciones). Solo se cargan en `helm install`, no en upgrades.
seed:
  enabled: false

service:
  type: ClusterIP
  port: 80

# Gateway API (alternativa al Ingress): crea un HTTPRoute hacia un Gateway que ya exista en el clúster.
httpRoute:
  enabled: false
  hostnames: []                 # vacío = ingress.host
  parentRefs: []                # p. ej. [{name: gateway-interno, namespace: infra}]

ingress:
  enabled: false
  className: ""
  host: ipam.example.com
  annotations: {}
  tls: []                       # [{secretName: ipam-tls, hosts: [ipam.example.com]}]

resources:
  requests: {cpu: 50m, memory: 96Mi}
  limits: {cpu: 500m, memory: 256Mi}

# NetworkPolicy: la app solo recibe tráfico en su puerto y solo sale a DNS, la base de datos y HTTPS
# (Jira / proveedor OIDC). La base incluida solo acepta conexiones de la app y del Job de esquema.
networkPolicy:
  enabled: true
  # Orígenes permitidos hacia la app. Vacío = cualquiera dentro del clúster (típico: el ingress controller
  # vive en otro namespace). Para restringir: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}}]
  ingressFrom: []
  # Puerto de la base cuando es externa (postgres.enabled=false) y destinos extra de salida (lista de reglas "to").
  externalDatabasePort: 5432
  egressExtra: []
