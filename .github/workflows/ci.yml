name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas (unitarias, integración, e2e)
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: mvp}}
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: ipam, POSTGRES_PASSWORD: ci, POSTGRES_DB: ipam}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ipam -d ipam" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://ipam:ci@127.0.0.1:5432/ipam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: mvp/package-lock.json}
      - run: npm ci
      - name: Esquema y datos de ejemplo
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed.sql
      - name: Unitarias + integración
        run: npm test
      - name: Navegador (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with: {name: playwright-report, path: mvp/test-results, if-no-files-found: ignore}

  chart:
    name: Chart de Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: El esquema y los datos del chart son los mismos que los de db/
        run: |
          diff mvp/db/schema.sql mvp/chart/ipam/files/schema.sql
          diff mvp/db/seed.sql mvp/chart/ipam/files/seed.sql
      - run: helm lint mvp/chart/ipam --set secrets.existingSecret=x
      - name: Render con OIDC activado
        run: helm template ipam mvp/chart/ipam --set auth.oidc.issuer=https://accounts.google.com --set auth.oidc.clientId=x --set secrets.oidcClientSecret=x --set config.publicUrl=https://ipam.example.com > /dev/null
      - run: helm template ipam mvp/chart/ipam --set secrets.existingSecret=x --set ingress.enabled=true > /tmp/render.yaml
      - name: kube-linter
        uses: stackrox/kube-linter-action@v1
        with: {directory: /tmp/render.yaml, config: .kube-linter.yaml}

  dockerfile:
    name: Dockerfile e imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with: {dockerfile: mvp/Dockerfile, failure-threshold: warning}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: mvp, load: true, tags: 'ipam:ci'}
      - name: Trivy (CRITICAL/HIGH con parche disponible)
        uses: aquasecurity/trivy-action@0.28.0
        with: {image-ref: 'ipam:ci', severity: 'CRITICAL,HIGH', ignore-unfixed: true, exit-code: '1'}
      - name: Prueba de humo de la imagen (solo lectura, sin capacidades)
        run: |
          docker network create ipam-ci
          docker run -d --name db --network ipam-ci -e POSTGRES_USER=ipam -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=ipam \
            -v "$PWD/mvp/db/schema.sql:/docker-entrypoint-initdb.d/01.sql:ro" -v "$PWD/mvp/db/seed.sql:/docker-entrypoint-initdb.d/02.sql:ro" postgres:16-alpine
          until docker exec db pg_isready -U ipam -d ipam >/dev/null 2>&1; do sleep 2; done; sleep 3
          docker run -d --name app --network ipam-ci --read-only --cap-drop ALL --security-opt no-new-privileges -p 8080:8080 \
            -e DATABASE_URL=postgres://ipam:ci@db:5432/ipam ipam:ci
          for i in $(seq 1 20); do curl -fs localhost:8080/api/health && break; sleep 1; done
          curl -fs localhost:8080/api/resumen
          curl -fs -o /dev/null -w "xlsx %{http_code}\n" localhost:8080/api/exportar.xlsx
          docker logs app
