# CI de GitHub: un envoltorio FINO. La lógica vive en el Makefile y en scripts/ci/ (los mismos que usa .gitlab-ci.yml y tu computador).
# Mismos trabajos y mismo orden que GitLab: validar → probar → escanear → construir. Acciones fijadas por commit (las actualiza Renovate).
name: CI
on:
  pull_request:
  push:
    branches: ['**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  # GitHub no entrega la rama por defecto como variable: se pasa aquí y scripts/ci/entorno.sh la traduce a IPAM_RAMA_POR_DEFECTO.
  IPAM_RAMA_POR_DEFECTO: ${{ github.event.repository.default_branch }}
  HUSKY: '0'

jobs:
  validar:
    name: validar · lint, tipos, portabilidad, chart, alertas
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22, cache: npm, cache-dependency-path: mvp/package-lock.json}
      - run: make deps
      - run: make portabilidad
      - run: make lint
      - run: make helm-check
      - run: make alertas

  probar:
    name: probar · PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    needs: validar
    strategy:
      fail-fast: false
      matrix:
        include:
          - {pg: 14, imagen: 'postgres:14-alpine@sha256:e73790e2702b489f664605acbec5f5da6981bc7e432f0489e52a53c9d1e7467f'}
          - {pg: 15, imagen: 'postgres:15-alpine@sha256:d2c2ced0372e855e4c257a9e9b5725f403847c01cfb64facbf2b21dbdadb2d74'}
          - {pg: 16, imagen: 'postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea'}
          - {pg: 17, imagen: 'postgres:17-alpine@sha256:1bcc18d81671b02906296aad470ec9778a6b71016ce953092024b680bad007b0'}
    services:
      postgres:
        image: ${{ matrix.imagen }}
        env: {POSTGRES_USER: ipam, POSTGRES_PASSWORD: ci, POSTGRES_DB: ipam}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ipam -d ipam" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://ipam:ci@127.0.0.1:5432/ipam
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22, cache: npm, cache-dependency-path: mvp/package-lock.json}
      - run: make deps
      - run: make test
      - run: make esquema
      - if: matrix.pg == 16
        run: make cobertura

  e2e:
    name: probar · navegador (Playwright)
    runs-on: ubuntu-latest
    needs: validar
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env: {POSTGRES_USER: ipam, POSTGRES_PASSWORD: ci, POSTGRES_DB: ipam}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ipam -d ipam" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://ipam:ci@127.0.0.1:5432/ipam
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22, cache: npm, cache-dependency-path: mvp/package-lock.json}
      - run: make deps
      - run: make test-e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: playwright-resultados, path: mvp/test-results, if-no-files-found: ignore}

  escanear:
    name: escanear · secretos, SAST, dependencias, IaC, SBOM
    runs-on: ubuntu-latest
    needs: validar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22, cache: npm, cache-dependency-path: mvp/package-lock.json}
      - run: make deps
      - run: make scan
      - run: make sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: sbom, path: sbom/ipam.cdx.json}

  construir:
    name: construir · imagen multi-arquitectura, Trivy y docker compose
    runs-on: ubuntu-latest
    needs: [probar, escanear]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: make build
      - run: make build-multiarch
      - run: make compose-check
