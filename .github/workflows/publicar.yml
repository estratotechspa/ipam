name: Publicar imagen
# Al crear una etiqueta vX.Y.Z construye la imagen y la publica en GHCR con SBOM y atestación de procedencia.
# La firma con Cosign está pendiente (ver docs/DEUDA-TECNICA.md).
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: mvp
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - uses: aquasecurity/trivy-action@0.28.0
        with: {image-ref: 'ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}', severity: 'CRITICAL,HIGH', ignore-unfixed: true, exit-code: '1'}
