# Mantiene despierto el POC del plan gratuito (opcional). Necesita la VARIABLE (no secreto) IPAM_URL del repositorio.
# GitHub puede retrasar o pausar los workflows programados en repos sin actividad. Para apagarlo, desactiva este workflow.
name: Keepalive POC
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.IPAM_URL != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {sparse-checkout: scripts/ci}
      - run: scripts/ci/keepalive.sh
        env:
          IPAM_URL: ${{ vars.IPAM_URL }}
