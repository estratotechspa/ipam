name: Seguridad
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'   # semanal: detecta vulnerabilidades nuevas sin cambios de código
permissions:
  contents: read

jobs:
  dependencias:
    name: Dependencias y licencias
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: mvp}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: mvp/package-lock.json}
      - run: npm ci
      - name: npm audit (solo producción)
        run: npm audit --omit=dev --audit-level=high
      - name: Licencias permitidas
        run: >-
          npx --yes license-checker-rseidelsohn@4 --production --summary --onlyAllow
          'MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;BlueOak-1.0.0;Python-2.0;CC0-1.0;CC-BY-4.0;Unlicense'

  secretos:
    name: Secretos en el repositorio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source /repo --redact --verbose

  codeql:
    name: Análisis estático (CodeQL)
    runs-on: ubuntu-latest
    permissions: {contents: read, security-events: write}
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: {languages: javascript-typescript}
      - uses: github/codeql-action/analyze@v3
