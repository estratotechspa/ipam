# Escaneo semanal: detecta vulnerabilidades NUEVAS sin cambios de código. Llama a los mismos objetivos que el CI.
name: Seguridad semanal
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  escanear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22, cache: npm, cache-dependency-path: mvp/package-lock.json}
      - run: make deps
      - run: make scan
  # CodeQL queda como COMPLEMENTO opcional (en repos privados exige GitHub Advanced Security): activar con la variable de repositorio CODEQL=true.
  # La barrera que cuenta es Semgrep, que corre igual en GitHub y GitLab.
