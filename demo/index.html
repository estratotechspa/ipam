<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPAM · Demo</title>
<style>
:root{--bg:#f4f6fa;--fg:#1c2333;--mut:#6b778c;--card:#fff;--line:#e3e8ef;--line2:#eef1f6;--top:#12203a;--blue:#2d6cdf;--accent:#4da3ff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1524;--fg:#e6eaf3;--mut:#93a0b8;--card:#18213a;--line:#2a3554;--line2:#222c47;--top:#0a1020}}
*{box-sizing:border-box}
body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
.top{background:var(--top);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.top b{font-size:18px}
.nav button{background:none;border:0;color:#fff;opacity:.7;margin-left:18px;padding:4px 0;font:inherit;cursor:pointer;border-bottom:2px solid transparent}
.nav button.on{opacity:1;border-color:var(--accent)}
.wrap{padding:24px;max-width:1200px;margin:0 auto}
h2{margin:0 0 14px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.card{background:var(--card);border-radius:10px;padding:18px;box-shadow:0 1px 3px #0002;flex:1;min-width:260px}
.kpi{font-size:28px;font-weight:700}.sub{color:var(--mut);font-size:12px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mut);font-size:12px;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line2)}
.tag{padding:2px 8px;border-radius:10px;font-size:11px;color:#fff}
.dev{background:#2e9e5b}.qa{background:#b8860b}.pre{background:#8a5cd6}.prod{background:#d64545}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;width:140px}
.bar i{display:block;height:100%;background:var(--accent)}
code{background:var(--line2);padding:2px 6px;border-radius:4px}
.btn{background:var(--blue);color:#fff;padding:9px 16px;border-radius:6px;border:0;font:inherit;cursor:pointer}
.btn.sec{background:transparent;color:var(--blue);border:1px solid var(--blue)}
label{display:block;font-size:12px;color:var(--mut);margin-top:10px}
input,select{width:100%;border:1px solid var(--line);border-radius:6px;padding:9px;background:var(--card);color:var(--fg);font:inherit;margin:4px 0 4px}
.alert{background:#fdecec;border:1px solid #e99;border-radius:8px;padding:14px;margin-bottom:14px;color:#8a1f1f}
.ok{background:#effaf3;border:1px solid #9ad0ae;border-radius:8px;padding:14px;margin-bottom:14px;color:#1d5a37}
@media (prefers-color-scheme:dark){.alert{background:#3a1c22;color:#ffb3b3;border-color:#7a3a44}.ok{background:#16301f;color:#a6e3bd;border-color:#2f6a46}}
.sug{border:1px solid #9ad0ae;border-radius:8px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.flow{display:flex;align-items:center;gap:10px;margin:14px 0;flex-wrap:wrap}
.box{background:var(--card);border:2px solid var(--blue);border-radius:8px;padding:12px 16px;text-align:center}
.box.jira{border-color:#0052cc;background:#e9f0ff;color:#12203a}
.arrow{font-size:22px;color:var(--blue)}
.log{font:12px ui-monospace,monospace;background:var(--line2);border-radius:8px;padding:12px;min-height:90px;max-height:240px;overflow:auto;white-space:pre-wrap}
.muted{color:var(--mut);font-size:12px}
.hide{display:none}
</style>
</head>
<body>
<div class="top"><b>IPAM · Gestión de segmentos <span class="muted" style="color:#9fb0cf">demo con datos ficticios</span></b>
  <div class="nav" id="nav">
    <button data-t="pools" class="on">Pools</button><button data-t="asig">Asignaciones</button><button data-t="sol">Solicitar</button><button data-t="jira">Jira</button>
  </div></div>

<div class="wrap" id="pools"></div>
<div class="wrap hide" id="asig"></div>
<div class="wrap hide" id="sol"></div>
<div class="wrap hide" id="jira"></div>

<script>
/* ---------- Lógica CIDR ---------- */
function ip2n(s){const p=s.split('.');if(p.length!==4)return null;let n=0;for(const x of p){if(!/^\d{1,3}$/.test(x)||+x>255)return null;n=n*256+ +x}return n}
function n2ip(n){return [n/16777216,(n/65536)%256,(n/256)%256,n%256].map(v=>Math.floor(v)).join('.')}
function parse(c){const m=/^(\d+\.\d+\.\d+\.\d+)\/(\d{1,2})$/.exec((c||'').trim());if(!m)return null;const ip=ip2n(m[1]),len=+m[2];if(ip===null||len<0||len>32)return null;const size=2**(32-len);return {ip,len,size,start:ip,end:ip+size-1,aligned:ip%size===0}}
const overlap=(a,b)=>a.start<=b.end&&b.start<=a.end;
const fmt=n=>n.toLocaleString('es-CL');

/* ---------- Datos ---------- */
const POOLS=[
 {id:'gke-nodos-prod',tipo:'Nodos',amb:'prod',prov:'GCP',cidr:'10.10.0.0/16'},
 {id:'gke-pods-prod',tipo:'Pods',amb:'prod',prov:'GCP',cidr:'10.64.0.0/12'},
 {id:'gke-svc-prod',tipo:'Servicios',amb:'prod',prov:'GCP',cidr:'10.96.0.0/16'},
 {id:'gke-cp-prod',tipo:'Control plane',amb:'prod',prov:'GCP',cidr:'172.16.0.0/20'},
 {id:'gke-nodos-qa',tipo:'Nodos',amb:'qa',prov:'GCP',cidr:'10.20.0.0/16'},
 {id:'onprem-lan-dev',tipo:'Nodos',amb:'dev',prov:'On-prem',cidr:'192.168.0.0/16'}];
const SEED=[
 ['gke-nodos-prod','10.10.0.0/20','vpc-pagos','mlopez','NET-120','2026-09-14'],
 ['gke-nodos-prod','10.10.16.0/20','vpc-clientes','jperez','NET-128','2026-09-22'],
 ['gke-nodos-prod','10.10.32.0/21','vpc-core','mlopez','NET-131','2026-09-25'],
 ['gke-pods-prod','10.64.0.0/21','vpc-pagos','mlopez','NET-121','2026-09-14'],
 ['gke-pods-prod','10.64.8.0/21','vpc-clientes','jperez','NET-142','2026-10-02'],
 ['gke-pods-prod','10.64.32.0/19','vpc-core','cquiroz','NET-133','2026-09-28'],
 ['gke-svc-prod','10.96.0.0/20','vpc-pagos','mlopez','NET-122','2026-09-14'],
 ['gke-cp-prod','172.16.0.0/28','vpc-pagos','mlopez','NET-123','2026-09-14'],
 ['gke-cp-prod','172.16.0.16/28','vpc-clientes','jperez','NET-129','2026-09-22'],
 ['gke-nodos-qa','10.20.0.0/20','vpc-qa','cquiroz','NET-110','2026-09-02'],
 ['onprem-lan-dev','192.168.0.0/24','lan-dev-a','cquiroz','NET-101','2026-08-20'],
 ['onprem-lan-dev','192.168.1.0/24','lan-dev-b','cquiroz','NET-102','2026-08-20']];
let ASIG=[],nextTicket=143,lastTicketMsg='';
try{const s=JSON.parse(localStorage.getItem('ipam-demo')||'null');if(s&&s.v===1){ASIG=s.a;nextTicket=s.n}}catch(e){}
if(!ASIG.length)reset();
function reset(){ASIG=SEED.map(([pool,cidr,vpc,user,ticket,fecha])=>({pool,cidr,vpc,user,ticket,fecha}));nextTicket=143;save()}
function save(){try{localStorage.setItem('ipam-demo',JSON.stringify({v:1,a:ASIG,n:nextTicket}))}catch(e){}}

/* ---------- Dominio ---------- */
const pool=id=>POOLS.find(p=>p.id===id);
const asigDe=id=>ASIG.filter(a=>a.pool===id);
function conflicto(poolId,c){return asigDe(poolId).find(a=>overlap(parse(a.cidr),c))}
function libres(poolId,len,max=3){
  const p=parse(pool(poolId).cidr),size=2**(32-len),out=[];
  if(len<p.len||len>32)return out;
  const ocup=asigDe(poolId).map(a=>parse(a.cidr)).sort((x,y)=>x.start-y.start);
  let cur=p.start;
  for(const o of ocup){ if(o.end<cur)continue;
    while(cur+size-1<o.start&&out.length<max&&cur+size-1<=p.end){out.push(n2ip(cur)+'/'+len);cur+=size}
    if(out.length>=max)return out; cur=Math.max(cur,Math.ceil((o.end+1)/size)*size)}
  while(out.length<max&&cur+size-1<=p.end){out.push(n2ip(cur)+'/'+len);cur+=size}
  return out}
function uso(poolId){const p=parse(pool(poolId).cidr);return asigDe(poolId).reduce((s,a)=>s+parse(a.cidr).size,0)/p.size}
function crear(poolId,cidr,vpc,user){
  const t='NET-'+(nextTicket++);
  ASIG.push({pool:poolId,cidr,vpc,user,ticket:t,fecha:new Date().toISOString().slice(0,10)});save();return t}

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(t){document.querySelectorAll('.wrap').forEach(w=>w.classList.toggle('hide',w.id!==t));
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render(t)}
$('nav').onclick=e=>{if(e.target.dataset.t)show(e.target.dataset.t)};
const tag=a=>`<span class="tag ${a}">${a}</span>`;

function renderPools(){
  const prom=POOLS.reduce((s,p)=>s+uso(p.id),0)/POOLS.length;
  $('pools').innerHTML=`<h2>Estado de pools</h2>
  <div class="row"><div class="card"><div class="kpi">${POOLS.length}</div><div class="sub">Pools</div></div>
  <div class="card"><div class="kpi">${ASIG.length}</div><div class="sub">Asignaciones activas</div></div>
  <div class="card"><div class="kpi">${(prom*100).toFixed(1).replace('.',',')}%</div><div class="sub">Uso promedio</div></div>
  <div class="card"><div class="kpi">${solapamientos()}</div><div class="sub">Solapamientos</div></div></div>
  <div class="card tablewrap" style="margin-top:16px"><table><tr><th>Pool</th><th>Tipo</th><th>Ambiente</th><th>Proveedor</th><th>CIDR base</th><th>Asig.</th><th>Uso</th></tr>
  ${POOLS.map(p=>{const u=uso(p.id);return `<tr><td>${p.id}</td><td>${p.tipo}</td><td>${tag(p.amb)}</td><td>${p.prov}</td><td><code>${p.cidr}</code></td><td>${asigDe(p.id).length}</td>
  <td><div class="bar" title="${(u*100).toFixed(2)}%"><i style="width:${Math.max(u*100,1)}%"></i></div></td></tr>`}).join('')}</table></div>
  <p class="muted">Datos ficticios; se guardan solo en este navegador. <button class="btn sec" id="rst">Restablecer demo</button></p>`;
  $('rst').onclick=()=>{reset();lastTicketMsg='';render('pools')}}
function solapamientos(){let n=0;for(const p of POOLS){const a=asigDe(p.id).map(x=>parse(x.cidr));for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++)if(overlap(a[i],a[j]))n++}return n}

function renderAsig(){
  $('asig').innerHTML=`<h2>Asignaciones</h2><div class="card tablewrap"><table><tr><th>Segmento</th><th>Pool</th><th>Proyecto / VPC</th><th>Direcciones</th><th>Solicitó</th><th>Ticket</th><th>Fecha</th></tr>
  ${[...ASIG].reverse().map(a=>`<tr><td><code>${esc(a.cidr)}</code></td><td>${esc(a.pool)}</td><td>${esc(a.vpc)}</td><td>${fmt(parse(a.cidr).size)}</td><td>${esc(a.user)}</td><td>${esc(a.ticket)}</td><td>${esc(a.fecha)}</td></tr>`).join('')}</table></div>`}

function renderSol(prefill){
  const v=Object.assign({pool:'gke-pods-prod',vpc:'vpc-pagos',cidr:'10.64.8.0/22',len:22},prefill||{});
  $('sol').innerHTML=`<h2>Solicitar segmento</h2><div class="row"><div class="card" style="max-width:420px;flex:none;width:100%">
  <label>Pool</label><select id="s-pool">${POOLS.map(p=>`<option value="${p.id}" ${p.id===v.pool?'selected':''}>${p.id} (${p.cidr})</option>`).join('')}</select>
  <label>Proyecto / VPC</label><input id="s-vpc" value="${esc(v.vpc)}">
  <label>CIDR manual (opcional; vacío = asignar el primer libre)</label><input id="s-cidr" value="${esc(v.cidr)}" placeholder="10.64.16.0/22">
  <label>Máscara (si no hay CIDR manual)</label><select id="s-len">${[16,18,19,20,21,22,23,24,26,28].map(n=>`<option ${n==v.len?'selected':''} value="${n}">/${n}</option>`).join('')}</select>
  <p><button class="btn" id="s-go">Solicitar</button></p></div>
  <div class="card" id="s-res"><p class="muted">Prueba el caso del mockup: pool gke-pods-prod, CIDR 10.64.8.0/22 → solapamiento con el ticket NET-142.${lastTicketMsg?`</p><div class="ok">${lastTicketMsg}</div><p class="muted">`:''}</p></div></div>`;
  $('s-go').onclick=solicitar}

function solicitar(){
  const pid=$('s-pool').value,vpc=$('s-vpc').value.trim(),manual=$('s-cidr').value.trim(),len=+$('s-len').value,res=$('s-res');
  const err=m=>res.innerHTML=`<div class="alert">${m}</div>`;
  if(!vpc)return err('Indica el proyecto / VPC.');
  const p=parse(pool(pid).cidr);
  let cidr=manual,c;
  if(manual){c=parse(manual);
    if(!c)return err('CIDR inválido. Formato: <code>10.64.16.0/22</code>.');
    if(!c.aligned)return err(`<code>${esc(manual)}</code> no está alineado: la dirección de red debe ser múltiplo de su tamaño (sugerido: <code>${n2ip(Math.floor(c.ip/c.size)*c.size)}/${c.len}</code>).`);
    if(c.start<p.start||c.end>p.end)return err(`<code>${esc(manual)}</code> queda fuera del pool <code>${pool(pid).cidr}</code>.`);
  }else{const l=libres(pid,len,1);if(!l.length)return err(`No quedan segmentos /${len} libres en ${pid}.`);cidr=l[0];c=parse(cidr)}
  const x=conflicto(pid,c);
  if(x){const sug=libres(pid,c.len,3);
    res.innerHTML=`<div class="alert"><b>⚠ Solapamiento detectado</b><br><code>${esc(cidr)}</code> se cruza con <code>${esc(x.cidr)}</code> asignado a <b>${esc(x.vpc)}</b> por <b>${esc(x.user)}</b> el ${esc(x.fecha)} (ticket ${esc(x.ticket)}).</div>
    <b>Segmentos libres sugeridos (/${c.len})</b><br><br>${sug.length?sug.map(s=>`<div class="sug"><code>${s}</code><button class="btn" data-use="${s}">Usar</button></div>`).join(''):'<p class="muted">No hay segmentos libres de ese tamaño.</p>'}`;
    res.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{$('s-cidr').value=b.dataset.use;solicitar()});return}
  const t=crear(pid,cidr,vpc,'cquiroz');
  lastTicketMsg=`Asignado <code>${esc(cidr)}</code> en ${esc(pid)} para ${esc(vpc)}. Jira creó el ticket <b>${t}</b>.`;
  res.innerHTML=`<div class="ok">✔ ${lastTicketMsg}</div><p class="muted">Pasa a la pestaña Asignaciones para verlo.</p>`;lastTicketMsg=''}

/* ---------- Jira (simulación) ---------- */
let jlog=[];
function renderJira(){
  $('jira').innerHTML=`<h2>Integración bidireccional con Jira</h2>
  <div class="card"><b>Sentido 1 · IPAM → Jira</b><div class="flow"><div class="box">Panel / API<br>solicita segmento</div><span class="arrow">→</span><div class="box">IPAM<br>valida y asigna</div><span class="arrow">→</span><div class="box jira">Jira crea ticket<br>NET-1xx</div><span class="arrow">→</span><div class="box">Guarda<br>ticket_jira_id</div></div>
  <span class="muted">Se ve en vivo al solicitar un segmento: cada asignación queda con su ticket.</span></div>
  <div class="card" style="margin-top:16px"><b>Sentido 2 · Jira → IPAM</b><div class="flow"><div class="box jira">Ticket «Solicitud de Segmento IPAM»<br>ambiente, tipo, pool, máscara, VPC</div><span class="arrow">→</span><div class="box">Webhook<br>(firmado)</div><span class="arrow">→</span><div class="box">IPAM calcula<br>y asigna</div><span class="arrow">→</span><div class="box jira">Actualiza ticket<br>con el rango</div></div>
  <div class="row"><div style="flex:1;min-width:240px"><b>Simular ticket entrante</b>
   <label>Ambiente</label><select id="j-amb"><option>prod</option><option>qa</option><option>dev</option></select>
   <label>Tipo</label><select id="j-tipo"><option>Nodos</option><option selected>Pods</option><option>Servicios</option><option>Control plane</option></select>
   <label>Máscara</label><select id="j-len">${[16,20,22,24,28].map(n=>`<option ${n==22?'selected':''} value="${n}">/${n}</option>`).join('')}</select>
   <label>VPC</label><input id="j-vpc" value="vpc-nueva"><p><button class="btn" id="j-go">Enviar webhook</button></p></div>
  <div style="flex:2;min-width:260px"><b>Registro del webhook</b><div class="log" id="j-log">${esc(jlog.join('\n'))||'(sin eventos)'}</div></div></div></div>`;
  $('j-go').onclick=simularJira}
function simularJira(){
  const amb=$('j-amb').value,tipo=$('j-tipo').value,len=+$('j-len').value,vpc=$('j-vpc').value.trim()||'vpc-sin-nombre';
  const t='NET-'+(nextTicket++);const L=m=>jlog.push(new Date().toLocaleTimeString('es-CL')+'  '+m);
  L(`Jira → POST /webhook  ${t} «Solicitud de Segmento IPAM» {ambiente:${amb}, tipo:${tipo}, máscara:/${len}, vpc:${vpc}}`);
  L('IPAM: firma HMAC-SHA256 válida (simulada)');
  const p=POOLS.find(x=>x.amb===amb&&x.tipo===tipo);
  if(!p){L(`IPAM: no hay pool ${tipo}/${amb} → ticket ${t} comentado: «sin pool disponible»`);save();return renderJira()}
  const l=libres(p.id,len,1);
  if(!l.length){L(`IPAM: ${p.id} sin segmentos /${len} libres → ticket ${t} comentado`);save();return renderJira()}
  ASIG.push({pool:p.id,cidr:l[0],vpc,user:'jira-webhook',ticket:t,fecha:new Date().toISOString().slice(0,10)});save();
  L(`IPAM: pool ${p.id}, asigna ${l[0]}`);L(`IPAM → Jira: ${t} actualizado con el rango ${l[0]} y transición a «Hecho»`);
  renderJira()}

function render(t){({pools:renderPools,asig:renderAsig,sol:()=>renderSol(),jira:renderJira})[t]()}
show('pools');
</script>
</body>
</html>
