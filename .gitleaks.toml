# gitleaks: detección de secretos (corre en CI y en el pre-commit). Extiende las reglas por defecto.
title = "IPAM"

[extend]
useDefault = true

[allowlist]
description = "Valores de relleno de ejemplos, documentación y pruebas: no son secretos reales"
regexes = [
  '''ipam_AbCdEfGhIjKlMnOpQrStUvWxYz0123456789-_ABCDE''',  # token de ejemplo del contrato OpenAPI
]
paths = [
  '''mvp/src/.*\.test\.js''',          # las pruebas usan claves y tokens inventados
  '''mvp/e2e/.*''',
  '''mvp/src/pruebas/.*''',
  '''.*\.env\.example''',
  '''docs/.*''',                        # la documentación usa valores de relleno
]
